name: Mobile OTA Update

# Publishes a JS-only OTA update to the `preview` EAS Update branch on every
# push to main that touches mobile/. Installed preview APKs pick it up on the
# next cold start (checkAutomatically: ON_LOAD in mobile/app.json).
#
# Limitations: updates only reach binaries whose runtime fingerprint matches.
# Native changes (new native deps, SDK bump, app.json native config) produce a
# new fingerprint — those pushes still need a full `eas build` + reinstall.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ota.yml'

permissions:
  contents: read

jobs:
  publish-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Installed binaries only receive updates when their baked-in
      # updates.url, channel, and runtime fingerprint all match what is
      # published. A missing/misconfigured updates block makes a binary
      # permanently un-updatable, so fail the publish loudly instead of
      # pushing an update no install can receive.
      - name: Verify OTA config and log runtime fingerprint
        run: |
          node -e '
            const c = require("./app.json").expo;
            const pid = c.extra && c.extra.eas && c.extra.eas.projectId;
            const url = c.updates && c.updates.url;
            if (!pid) throw new Error("extra.eas.projectId missing from app.json");
            if (url !== "https://u.expo.dev/" + pid)
              throw new Error("updates.url is missing or does not match projectId: " + url);
            if (c.updates.enabled !== true) throw new Error("updates.enabled is not true");
            if ((c.runtimeVersion || {}).policy !== "fingerprint")
              throw new Error("runtimeVersion.policy must be \"fingerprint\"");
            console.log("OTA config OK: " + url);
          '
          npx expo-updates fingerprint:generate --platform android \
            | jq -r '"runtime fingerprint (android): " + .hash'

      - name: Publish OTA update to preview branch
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
          # eas update does not read eas.json build-profile env — these must be
          # supplied explicitly so EXPO_PUBLIC_* vars get inlined into the
          # bundle (mobile/.env is gitignored and absent in CI).
          EXPO_PUBLIC_API_URL: http://100.70.218.115
          EXPO_PUBLIC_POWERSYNC_URL: http://100.70.218.115/powersync
        run: eas update --branch preview --platform android --message "$UPDATE_MESSAGE" --non-interactive
