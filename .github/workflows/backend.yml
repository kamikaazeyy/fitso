name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'server/worker/**'
      - 'server/prisma/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/worker/**'
      - 'server/prisma/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Bundles the Worker and validates the Prisma schema. Runs on every PR and
  # push — no secrets required, nothing is deployed.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/worker/package-lock.json

      - name: Install worker deps
        working-directory: server/worker
        run: npm ci

      - name: Bundle check (no deploy)
        working-directory: server/worker
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Validate Prisma schema
        working-directory: server
        run: |
          npm ci --ignore-scripts
          npx prisma validate

  # Pushes the schema to Supabase, then deploys fitso-api to Cloudflare
  # Workers. Schema goes first so the Worker never ships code that expects
  # columns the database doesn't have yet.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/worker/package-lock.json

      - name: Push Prisma schema to Supabase
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SUPABASE_DATABASE_URL secret not set — skipping schema push"
            exit 0
          fi
          npm ci --ignore-scripts
          npx prisma db push --skip-generate

      - name: Install worker deps
        working-directory: server/worker
        run: npm ci

      - name: Deploy fitso-api to Cloudflare Workers
        working-directory: server/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
