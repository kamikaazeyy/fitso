config:
  edition: 3

streams:
  # Workouts — synced per user
  workouts:
    auto_subscribe: true
    query: >
      SELECT
        id,
        "userId" as user_id,
        "routineId" as routine_id,
        "splitId" as split_id,
        "workoutType" as workout_type,
        title,
        "startedAt" as started_at,
        "finishedAt" as finished_at,
        "durationSeconds" as duration_seconds,
        "distanceMeters" as distance_meters,
        "avgPaceSecondsPerKm" as avg_pace_seconds_per_km,
        "maxSpeedMps" as max_speed_mps,
        "elevationGainMeters" as elevation_gain_meters,
        "caloriesBurned" as calories_burned,
        "routeCoordinates" as route_coordinates,
        splits,
        "createdAt" as created_at
      FROM "Workout" AS workouts
      WHERE "userId" = auth.user_id()

  # Workout sets — synced via the parent workout's user
  workout_sets:
    auto_subscribe: true
    query: >
      SELECT
        workout_sets.id,
        workout_sets."workoutId" as workout_id,
        workout_sets."exerciseName" as exercise_name,
        workout_sets."wgerId" as wger_id,
        workout_sets."orderIndex" as order_index,
        workout_sets."setNumber" as set_number,
        workout_sets."setType" as set_type,
        workout_sets.weight,
        workout_sets.reps,
        workout_sets.rpe,
        workout_sets."isCompleted" as is_completed,
        workout_sets.attachment,
        workout_sets."createdAt" as created_at
      FROM "WorkoutSet" AS workout_sets
      INNER JOIN "Workout" w ON workout_sets."workoutId" = w.id
      WHERE w."userId" = auth.user_id()

  # Routines — synced per user
  routines:
    auto_subscribe: true
    query: >
      SELECT
        id,
        "userId" as user_id,
        name,
        notes,
        "createdAt" as created_at,
        "updatedAt" as updated_at
      FROM "Routine" AS routines
      WHERE "userId" = auth.user_id()

  # Splits — synced via the parent routine's user
  splits:
    auto_subscribe: true
    query: >
      SELECT
        splits.id,
        splits."routineId" as routine_id,
        splits.name,
        splits."orderIndex" as order_index,
        splits."createdAt" as created_at
      FROM "Split" AS splits
      INNER JOIN "Routine" r ON splits."routineId" = r.id
      WHERE r."userId" = auth.user_id()

  # Routine exercises — synced via split → routine → user
  routine_exercises:
    auto_subscribe: true
    query: >
      SELECT
        routine_exercises.id,
        routine_exercises."splitId" as split_id,
        routine_exercises."exerciseName" as exercise_name,
        routine_exercises."wgerId" as wger_id,
        routine_exercises.equipment,
        routine_exercises.attachment,
        routine_exercises."orderIndex" as order_index,
        routine_exercises."targetSets" as target_sets,
        routine_exercises."targetReps" as target_reps,
        routine_exercises."targetRepsMax" as target_reps_max,
        routine_exercises."targetWeight" as target_weight,
        routine_exercises."restSeconds" as rest_seconds,
        routine_exercises."createdAt" as created_at
      FROM "RoutineExercise" AS routine_exercises
      INNER JOIN "Split" s ON routine_exercises."splitId" = s.id
      INNER JOIN "Routine" r ON s."routineId" = r.id
      WHERE r."userId" = auth.user_id()

  # User-created exercises — synced per user
  custom_exercises:
    auto_subscribe: true
    query: >
      SELECT
        id,
        "userId" as user_id,
        name,
        equipment,
        category,
        muscles,
        notes,
        "createdAt" as created_at
      FROM "CustomExercise" AS custom_exercises
      WHERE "userId" = auth.user_id()
