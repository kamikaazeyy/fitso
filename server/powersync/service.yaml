_type: self-hosted

telemetry:
  disable_telemetry_sharing: true

# Source database replication
replication:
  connections:
    - type: postgresql
      uri: postgresql://fitso:fitso-secret@postgres:5432/fitso
      sslmode: disable

# Bucket storage (using Postgres on the same instance, separate schema)
storage:
  type: postgresql
  uri: postgresql://fitso:fitso-secret@postgres:5432/fitso
  sslmode: disable

# PowerSync API server port
port: 8080

# Sync rules / streams
sync_config:
  path: sync-config.yaml

# Client authentication — verify JWTs signed with our RSA private key
